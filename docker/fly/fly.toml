app = "arc-relay-gezim"
primary_region = "ams"

[env]
  ARC_RELAY_KEY = "brave-anning-8d4ea383"

[[mounts]]
  source = "arc_relay_keys"
  destination = "/home/arc/.config/arc"

[[services]]
  protocol = "tcp"
  internal_port = 7331
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7331

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
