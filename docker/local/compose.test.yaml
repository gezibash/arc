# Only the smoke test adds this client. Normal agents use installed ARC.
services:
  client:
    image: ${ARC_LOCAL_IMAGE:-${COMPOSE_PROJECT_NAME:-arc-local}-services:0.4.1}
    pull_policy: never
    profiles: [tools]
    init: true
    entrypoint: [/opt/arc-local/entrypoint.sh, client]
    command: [help]
    volumes:
      - client-config:/home/arc/.config/arc
      - client-data:/home/arc/.arc
      - relay-public:/run/arc/relay:ro

volumes:
  client-config:
  client-data:
