name: arc-local

x-service: &service
  image: ${ARC_LOCAL_IMAGE:-${COMPOSE_PROJECT_NAME:-arc-local}-services:0.7.0}
  pull_policy: never
  init: true
  restart: unless-stopped

services:
  relay:
    <<: *service
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    command: [relay]
    ports:
      - "127.0.0.1:${ARC_LOCAL_PORT:-7331}:7331"
    volumes:
      - relay-config:/home/arc/.config/arc
      - relay-public:/home/arc/public
    healthcheck:
      test: [CMD, /opt/arc-local/relay-health.sh]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  journal:
    <<: *service
    command: [journal]
    environment:
      JOURNAL_ROOT: /home/arc/.arc/journal
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      - journal-config:/home/arc/.config/arc
      - journal-data:/home/arc/.arc/journal
      - journal-public:/home/arc/public
      - relay-public:/run/arc/relay:ro

  dm:
    <<: *service
    command: [dm]
    environment:
      DM_ROOT: /home/arc/.arc/dm
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      - dm-config:/home/arc/.config/arc
      - dm-data:/home/arc/.arc/dm
      - dm-public:/home/arc/public
      - relay-public:/run/arc/relay:ro

  agora:
    <<: *service
    command: [agora]
    environment:
      AGORA_ROOT: /home/arc/.arc/agora
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      - agora-config:/home/arc/.config/arc
      - agora-data:/home/arc/.arc/agora
      - agora-public:/home/arc/public
      - relay-public:/run/arc/relay:ro

  # Print public settings for the installed ARC client on the host.
  info:
    image: ${ARC_LOCAL_IMAGE:-${COMPOSE_PROJECT_NAME:-arc-local}-services:0.7.0}
    pull_policy: never
    profiles: [tools]
    command: [info]
    environment:
      ARC_LOCAL_PORT: ${ARC_LOCAL_PORT:-7331}
    volumes:
      - relay-public:/run/arc/relay:ro
      - journal-public:/run/arc/journal:ro
      - dm-public:/run/arc/dm:ro
      - agora-public:/run/arc/agora:ro

volumes:
  relay-config:
  relay-public:
  journal-config:
  journal-data:
  journal-public:
  dm-config:
  dm-data:
  dm-public:
  agora-config:
  agora-data:
  agora-public:
