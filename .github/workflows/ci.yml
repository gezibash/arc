name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  cli:
    name: ARC end to end in Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - run: bash scripts/test-go-cli.sh

  proofs:
    name: Go against Elixir
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: mix-test-28-1.19.5-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: mix-test-28-1.19.5-
      - name: Fetch the Elixir dependencies
        working-directory: elixir
        run: mix deps.get
      - name: The Go client talks to an Elixir relay
        working-directory: elixir
        run: mix run scripts/test-go-client.exs
      - name: An Elixir citizen runs the Go provider
        working-directory: elixir
        run: mix run scripts/test-go-provider.exs
      - name: Elixir clients talk to the Go relay
        working-directory: elixir
        run: mix run scripts/test-go-relay.exs
      - name: A Go relay federates with an Elixir relay
        working-directory: elixir
        run: mix run scripts/test-go-federation.exs
