name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
      release: ${{ steps.paths.outputs.release }}
      race: ${{ steps.race.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import PurePosixPath
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)
          if os.environ["EVENT_NAME"] == "pull_request":
              pr = event["pull_request"]
              revision = f"{pr['base']['sha']}...{pr['head']['sha']}"
          else:
              revision = f"{event['before']}..{event['after']}"
          # A missing base (for example a new branch) must run all checks.
          diff = subprocess.run(
              ["git", "diff", "--name-only", "--no-renames", "-z", revision],
              capture_output=True,
          )
          code = release = diff.returncode != 0
          for raw in diff.stdout.split(b"\0"):
              if not raw:
                  continue
              path = PurePosixPath(os.fsdecode(raw))
              # Only known prose files are exempt. Unknown paths run tests.
              # A spec, a proposal and the two registries are inputs of the
              # tests in internal/specs, so they are not exempt.
              checked = (
                  path.name in {"SPEC.md", "KINDS.md", "GRANDFATHERED.md", "SPEC-TEMPLATE.md"}
                  or "proposals" in path.parts
              )
              docs = not checked and path.suffix == ".md" and (
                  len(path.parts) == 1 or path.parts[0] == "docs"
              )
              code |= not docs
              release |= (
                  path.name in {"Dockerfile", ".dockerignore", ".gitignore"}
                  or str(path) in {"go.mod", "go.sum", "mise.toml"}
                  or str(path).startswith(".github/")
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"code={str(code).lower()}", file=output)
              print(f"release={str(release).lower()}", file=output)
          PYTHON
      # The race jobs run the packages, and each shard of the proofs.
      - id: race
        name: List the parts of the race jobs
        run: |
          parts=$( (echo packages; .github/scripts/proof-shards.sh names) | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: Build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      # The version must match golangci-lint in mise.toml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Check that go fix has nothing to apply
        run: test -z "$(go fix -diff ./...)"
      # The version must match govulncheck in mise.toml.
      - name: Check for known vulnerabilities that the code calls
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go build ./...
      # Each proof test must be in exactly one shard of the race jobs.
      - name: Check the shards of the proofs
        run: .github/scripts/proof-shards.sh check
      # The proofs build the programs and run them end to end. They have
      # their own jobs below.
      - run: go test $(go list ./... | grep -v '/internal/proof$')

  delivery:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: Delivery proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - run: go test -count=1 -run '^TestDelivery' ./internal/proof/

  interface:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: Interface proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - run: go test -count=1 -run '^TestInterface' ./internal/proof/

  # The race detector runs in its own jobs, so the jobs above stay fast.
  # The proofs are split into shards by .github/scripts/proof-shards.sh.
  # GOFLAGS reaches each `go build` that a test runs, so the programs that
  # the tests start also have the race detector. Each process writes its
  # race reports to a file. A program that a test stops cannot report a
  # race in its exit status, so the last step fails on any report file.
  race:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: Race detector (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.changes.outputs.race) }}
    steps:
      # A storage proof builds an older storage app from git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The cache of setup-go holds no builds with the race detector. These
      # jobs keep their own build cache: one for the packages, one for the
      # proofs. Only a push to main saves it, so the caches stay small. A
      # pull request restores the latest cache of main.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: false
      - id: cache
        name: Name the race build cache
        run: |
          if [ "${{ matrix.part }}" = packages ]; then
            echo "kind=packages" >> "$GITHUB_OUTPUT"
          else
            echo "kind=proofs" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-1.27.2-${{ steps.cache.outputs.kind }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-1.27.2-${{ steps.cache.outputs.kind }}-
      - name: Test with the race detector
        env:
          GOFLAGS: -race
          GORACE: log_path=${{ runner.temp }}/race/report
          PART: ${{ matrix.part }}
        run: |
          mkdir -p "$RUNNER_TEMP/race"
          if [ "$PART" = packages ]; then
            go test -count=1 $(go list ./... | grep -v '/internal/proof$')
          else
            .github/scripts/proof-shards.sh run "$PART"
          fi
      - name: Fail on a race report from any process
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/race/report.*)
          for report in "${reports[@]}"; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
          if [ "${#reports[@]}" -gt 0 ]; then
            echo "::error::${#reports[@]} processes reported a data race"
            exit 1
          fi
      # The storage-pieces shard builds the most for the proofs: the
      # programs of this commit, and the older programs.
      - if: ${{ github.event_name == 'push' && (matrix.part == 'packages' || matrix.part == 'storage-pieces') }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-1.27.2-${{ steps.cache.outputs.kind }}-${{ github.sha }}

  # Check the actual release recipe only when its inputs change.
  # Skipped jobs still satisfy the existing required status checks.
  clean-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release == 'true') }}
    name: Clean release builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - run: bash .github/scripts/check-clean-build.sh
