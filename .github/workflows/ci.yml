name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
      release: ${{ steps.paths.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import PurePosixPath
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)
          if os.environ["EVENT_NAME"] == "pull_request":
              pr = event["pull_request"]
              revision = f"{pr['base']['sha']}...{pr['head']['sha']}"
          else:
              revision = f"{event['before']}..{event['after']}"
          # A missing base (for example a new branch) must run all checks.
          diff = subprocess.run(
              ["git", "diff", "--name-only", "--no-renames", "-z", revision],
              capture_output=True,
          )
          code = release = diff.returncode != 0
          for raw in diff.stdout.split(b"\0"):
              if not raw:
                  continue
              path = PurePosixPath(os.fsdecode(raw))
              # Only known prose files are exempt. Unknown paths run tests.
              docs = path.suffix == ".md" and (
                  len(path.parts) == 1 or path.parts[0] == "docs"
              )
              code |= not docs
              release |= (
                  path.name in {"Dockerfile", ".dockerignore", ".gitignore"}
                  or str(path) in {"go.mod", "go.sum", "mise.toml", "scripts/check-clean-build.sh"}
                  or str(path).startswith(".github/workflows/")
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"code={str(code).lower()}", file=output)
              print(f"release={str(release).lower()}", file=output)
          PYTHON

  go:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: Build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  delivery:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: Delivery proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - run: bash scripts/test-delivery.sh

  interface:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: Interface proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - run: bash scripts/test-interface.sh

  # Check the actual release recipe only when its inputs change.
  # Skipped jobs still satisfy the existing required status checks.
  clean-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release == 'true') }}
    name: Clean release builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - run: bash scripts/check-clean-build.sh
