name: Flake 237 proof (temporary)

on:
  push:
    branches: [claude/clever-rubin-241ded]

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            flags: ""
            load: "0"
          - name: race under load
            flags: "-race"
            load: "4"
    name: core/call -count=200 (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - name: Test core/call 200 times
        run: |
          for i in $(seq 1 ${{ matrix.load }}); do yes > /dev/null & done
          nproc
          GOMAXPROCS=2 go test ${{ matrix.flags }} -count=200 -timeout 55m ./core/call/ ./core/session/
