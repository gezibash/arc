name: Release

# Tag a commit `vX.Y.Z` to publish:
#   - release tarballs for Linux x86_64, Linux aarch64, macOS aarch64
#   - a multi-arch image at ghcr.io/<owner>/arc
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.27.1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/arc

jobs:
  version:
    name: Read the version from the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "the tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1 ;;
          esac
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  tarball:
    name: Tarballs
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Go cross-compiles every target from one runner. Each tarball holds
      # arc/bin/, which is the layout that install.sh unpacks.
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux-x86_64:linux:amd64 linux-aarch64:linux:arm64 darwin-aarch64:darwin:arm64; do
            name="${target%%:*}"
            rest="${target#*:}"
            stage="dist/stage/arc/bin"
            rm -rf dist/stage
            mkdir -p "$stage"
            GOOS="${rest%%:*}" GOARCH="${rest#*:}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$stage/" ./cmd/...
            tar -C dist/stage -czf "dist/arc-$VERSION-$name.tar.gz" arc
          done
          rm -rf dist/stage
      - name: Smoke test the native build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go build -ldflags "-X main.version=$VERSION" -o /tmp/arc ./cmd/arc
          /tmp/arc version
          /tmp/arc --help > /dev/null
          /tmp/arc status --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    name: Image ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Native build per arch, pushed by digest. The manifest job below
      # joins the two digests under the version tags.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      # The file is named by the bare hex: upload-artifact refuses a colon
      # in a path, and the manifest job adds the sha256: prefix back.
      - name: Export digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  manifest:
    name: Publish multi-arch image
    needs: [version, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create manifest list
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.version.outputs.version }}"

  github-release:
    name: GitHub release
    needs: [version, tarball, manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tarballs
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "arc" \
            --generate-notes \
            --notes "Image: \`${{ env.IMAGE }}:${{ needs.version.outputs.version }}\`" \
            dist/*
