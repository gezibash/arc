[tools]
erlang = "28"
elixir = "1.19.5-otp-28"
go = "1.27.1"

[env]
_.path = ["bin"]

[tasks.deps]
description = "Fetch dependencies"
run = "mix deps.get"

[tasks.compile]
description = "Compile all apps"
run = "mix compile"

[tasks.build]
description = "Fetch deps and compile"
depends = ["deps", "compile"]

[tasks.test]
description = "Run all tests"
run = "mix test"
raw = true

[tasks.fmt]
description = "Format code"
run = "mix format"

[tasks."fmt.check"]
description = "Check formatting"
run = "mix format --check-formatted"

[tasks.lint]
description = "Format check, warnings-as-errors compile, credo, xref"
run = "mix lint"

[tasks.audit]
description = "Unused lock entries, retired packages, advisories"
run = "mix audit"

[tasks.dialyzer]
description = "Dialyzer type analysis (PLT cached in _build/plts)"
run = "mix dialyzer"

[tasks.check]
description = "Full check pipeline: lint, audit, dialyzer, test"
run = "mix check"

[tasks.iex]
description = "Start interactive shell"
run = "iex -S mix"

[tasks.arc]
description = "Run the arc CLI"
run = "mix run --no-start -e \"Arc.CLI.main(System.argv())\" --"
raw = true

[tasks.escript]
description = "Build the arc escript binary"
dir = "apps/arc_cli"
run = "mix escript.build"

[tasks.release]
description = "Build the prod release (bundled runtime) into _build/prod/rel/arc_runtime"
run = "mix release arc_runtime --overwrite"
env = { MIX_ENV = "prod" }

[tasks."go.test"]
description = "Run the Go tests"
dir = "go"
run = "go test ./..."
raw = true

[tasks."go.lint"]
description = "Format check and vet the Go packages"
dir = "go"
run = ["test -z \"$(gofmt -l .)\"", "go vet ./..."]

[tasks."go.conformance"]
description = "Run the Go client against an Elixir relay"
run = "mix run scripts/test-go-client.exs"
raw = true

[tasks."go.provider"]
description = "Run the Go exec provider under the Elixir runtime"
run = "mix run scripts/test-go-provider.exs"
raw = true

[tasks.vectors]
description = "Write the shared protocol vectors that both implementations read"
run = "mix run --no-start scripts/write-vectors.exs"

[tasks.clean]
description = "Clean build artifacts"
run = "mix clean"
