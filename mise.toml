[tools]
erlang = "28"
elixir = "1.19.5"

[env]
_.path = ["bin"]

[tasks.deps]
description = "Fetch dependencies"
run = "mix deps.get"

[tasks.compile]
description = "Compile all apps"
run = "mix compile"

[tasks.build]
description = "Fetch deps and compile"
depends = ["deps", "compile"]

[tasks.test]
description = "Run all tests"
run = "mix test"
raw = true

[tasks.fmt]
description = "Format code"
run = "mix format"

[tasks."fmt.check"]
description = "Check formatting"
run = "mix format --check-formatted"

[tasks.lint]
description = "Format check, warnings-as-errors compile, credo, xref"
run = "mix lint"

[tasks.audit]
description = "Unused lock entries, retired packages, advisories"
run = "mix audit"

[tasks.dialyzer]
description = "Dialyzer type analysis (PLT cached in _build/plts)"
run = "mix dialyzer"

[tasks.check]
description = "Full check pipeline: lint, audit, dialyzer, test"
run = "mix check"

[tasks.iex]
description = "Start interactive shell"
run = "iex -S mix"

[tasks.arc]
description = "Run the arc CLI"
run = "mix run --no-start -e \"Arc.CLI.main(System.argv())\" --"
raw = true

[tasks.escript]
description = "Build the arc escript binary"
dir = "apps/arc_cli"
run = "mix escript.build"

[tasks.release]
description = "Build the prod release (bundled runtime) into _build/prod/rel/arc_runtime"
run = "mix release arc_runtime --overwrite"
env = { MIX_ENV = "prod" }

[tasks.clean]
description = "Clean build artifacts"
run = "mix clean"
